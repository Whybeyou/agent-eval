[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-kit"
version = "0.1.0"
description = "轻量 LLM Agent 评测框架：规则机评 & LLM-Judge 双轨 + 维度加权/风险否决 + Badcase 归因"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "李昊", email = "18870235592@163.com" }]
keywords = ["agent", "evaluation", "llm", "rubric", "llm-judge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Whybeyou/agent-eval"

[tool.setuptools]
packages = ["evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
