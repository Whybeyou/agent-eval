<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentEval · 评测控制台</title>
<style>
/* AgentEval 控制台 —— Monitor 型界面
   视觉锚点：深色监控舱（蓝黑 / 青绿单信号 / 微光晕 / 圆角面板）
   密度纪律：数字一律等宽 + tabular，标签小字大写疏排，分隔用 1px 发光线而非色块
*/
:root{
  --bg:#080d13; --panel:#0f1721; --panel2:#131d29; --line:#1c2937; --line2:#243040;
  --fg:#dae6f3; --mut:#7b8da3; --dim:#55677c;
  --acc:#2ee6c0; --warn:#ffb84d; --bad:#ff6b6b; --violet:#8b9bff;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Helvetica Neue","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 460px at 12% -8%, #12202b 0%, transparent 62%),
    radial-gradient(900px 420px at 92% 8%, #101a2b 0%, transparent 60%),
    var(--bg);
  color:var(--fg); font:13.5px/1.65 var(--sans);
  font-feature-settings:"tnum" 1,"cv01" 1; -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ---------------- 布局 */
.shell{display:grid;grid-template-columns:266px minmax(0,1fr);min-height:100vh}
.rail{
  border-right:1px solid var(--line); padding:22px 15px 18px;
  background:linear-gradient(180deg,#0c141d,#0a1119 70%,#090f16);
  display:flex;flex-direction:column;gap:18px; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.dot{width:27px;height:27px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--acc),#3b82f6);box-shadow:0 0 20px rgba(46,230,192,.32)}
.brand-txt b{font-size:14.5px;letter-spacing:.02em;display:block;line-height:1.2}
.brand-txt span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

.rl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);
  padding:0 5px 8px;display:flex;justify-content:space-between;align-items:baseline}
.rl em{font-style:normal;color:var(--dim);letter-spacing:.06em}

.rail-list{display:flex;flex-direction:column;gap:2px}
.s{display:flex;align-items:center;gap:11px;padding:8px;border-radius:11px;cursor:pointer;
  border:1px solid transparent;transition:background .16s ease,border-color .16s ease}
.s:hover{background:#111c27}
.s.on{background:#101c26;border-color:#20303f}
.s .meta{min-width:0;flex:1}
.s .n{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s em{display:block;font-style:normal;font-size:10.5px;color:var(--mut);font-family:var(--mono)}
.ring{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;
  transition:transform .18s ease}
.s:hover .ring{transform:scale(1.04)}
.ring i{width:30px;height:30px;border-radius:50%;background:#0a1118;display:grid;place-items:center;
  font:600 9.5px/1 var(--mono);font-style:normal;color:#eaf6ff;letter-spacing:-.02em}
.runbtn{opacity:0;border:none;background:#16232f;color:var(--acc);border-radius:7px;
  width:22px;height:22px;cursor:pointer;font-size:10px;transition:opacity .16s ease;flex:none}
.s:hover .runbtn{opacity:1}

.rail-filter{padding-top:4px;border-top:1px solid #16212d;display:flex;flex-direction:column;gap:8px}
.input{width:100%;background:#0c1620;border:1px solid var(--line);border-radius:9px;
  color:var(--fg);padding:7px 10px;font:12px/1.5 var(--sans);outline:none}
.input:focus{border-color:#2c4356;box-shadow:0 0 0 3px rgba(46,230,192,.08)}
.switch{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);cursor:pointer;padding:0 4px}
.switch input{accent-color:var(--acc)}

.rail-foot{margin-top:auto;border-top:1px solid #16212d;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.rail-foot div{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--dim)}
.rail-foot b{color:var(--mut);font-weight:400;max-width:150px}

/* ---------------- 主区 */
.main{padding:24px 28px 54px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
h1{font-size:21px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--mut);font-size:12.5px;margin-top:5px}
.head-actions{display:flex;align-items:center;gap:9px}
.runmeta{font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.btn{background:linear-gradient(180deg,#1b3a44,#152b34);border:1px solid #23414c;color:#d6fbf3;
  padding:7px 14px;border-radius:9px;font:12.5px/1 var(--sans);cursor:pointer;transition:.16s ease}
.btn:hover{border-color:#2f5a66;transform:translateY(-1px)}
.btn.ghost{background:#101a24;border-color:var(--line2);color:var(--mut)}
.btn.ghost:hover{color:var(--fg);border-color:#2c4356}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.icon{padding:5px 9px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(46,230,192,.5),transparent)}
.kpi .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:29px;font-weight:600;margin-top:7px;letter-spacing:-.02em}
.kpi .v.acc{color:var(--acc);text-shadow:0 0 26px rgba(46,230,192,.28)}
.kpi .v.warn{color:var(--warn)}
.kpi .s{font-size:11px;color:var(--mut);margin-top:2px;font-family:var(--mono)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  margin-top:15px;padding:15px 17px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:10px}
.ph h2{font-size:13.5px;font-weight:600}
.ph span{font-size:11px;color:var(--dim)}

/* 通过率条 */
.bars{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:190px minmax(80px,1fr) 62px 60px 62px 66px;
  gap:13px;align-items:center;padding:9px 0;border-top:1px solid #16212d;cursor:pointer}
.brow:first-child{border-top:none}
.bhead{border-top:none;padding-bottom:2px}
.bhead .nm,.bhead .val,.bhead .sm{color:var(--dim);font:10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.brow:hover{background:#0e1a24}
.brow .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;border-radius:6px;background:#131f2a;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.brow .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;
  font-weight:600;text-align:right}
.brow .sm{font:11px/1 var(--mono);color:var(--mut);text-align:right}

/* 明细表 */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;min-width:760px;border-collapse:collapse}
th{text-align:left;font:10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--line2);
  white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--mut)}
th.num,td.num{text-align:right}
th.sorted{color:var(--acc)}
td{padding:8px 10px;border-bottom:1px solid #131e29;font-size:12.5px;vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#0e1a24}
td.id{font-family:var(--mono);font-size:11.5px;color:#c9d8e8}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font:11px/1 var(--mono);
  padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut)}
.pill.ok{color:var(--acc);border-color:#1d4a42;background:rgba(46,230,192,.07)}
.pill.no{color:var(--bad);border-color:#4a2424;background:rgba(255,107,107,.07)}
.pill.risk{color:var(--warn);border-color:#4a3a1d;background:rgba(255,184,77,.08)}
.dotp{width:6px;height:6px;border-radius:50%;background:currentColor}
.chev{color:var(--dim);font-size:11px}
.empty{padding:26px;text-align:center;color:var(--dim);font-size:12.5px}

/* badcase */
.bcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bcard{background:#121b25;border:1px solid var(--line2);border-left:2px solid var(--bad);
  border-radius:9px;padding:10px 12px;cursor:pointer;transition:.16s ease}
.bcard:hover{background:#152232;transform:translateY(-1px)}
.bid{font-family:var(--mono);font-size:11.5px;color:#ffd7d7}
.bs{font-size:10.5px;color:var(--mut);margin-top:2px}
.bnone{color:var(--dim);font-size:12.5px;padding:6px 0}

.foot{margin-top:22px;color:#46586b;font-size:11.5px}

/* ---------------- 抽屉 */
.backdrop{position:fixed;inset:0;background:rgba(4,8,12,.62);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(620px,94vw);z-index:50;
  background:linear-gradient(180deg,#0e1823,#0b131c);border-left:1px solid var(--line2);
  box-shadow:-30px 0 60px rgba(0,0,0,.5);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.22,.7,.2,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.did{font-size:13px;color:#eaf6ff;letter-spacing:.02em}
.dsub{font-size:11px;color:var(--mut);margin-top:3px}
.dact{display:flex;gap:7px;flex:none}
.drawer-body{padding:16px 20px 40px;overflow:auto}
.dsec{margin-bottom:20px}
.dsec h3{font:10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline}
.dsec h3 em{font-style:normal;color:var(--mut);letter-spacing:.04em}
pre{white-space:pre-wrap;word-break:break-word;background:#0a141d;border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;font:11.5px/1.7 var(--mono);color:#c3d6e6;max-height:240px;overflow:auto}
.turns{display:flex;flex-direction:column;gap:6px}
.turn{background:#0a141d;border:1px solid var(--line);border-radius:9px;padding:8px 11px;
  font-size:12px;color:#c9d8e8}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.chk{font:11px/1 var(--mono);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;color:var(--mut)}
.chk.ok{color:var(--acc);border-color:#1d4a42;background:rgba(46,230,192,.06)}
.chk.no{color:var(--bad);border-color:#4a2424;background:rgba(255,107,107,.07)}
.chk.na{color:var(--dim)}
.dims{display:flex;flex-direction:column;gap:7px}
.dim{display:grid;grid-template-columns:78px 1fr 44px;gap:10px;align-items:center;font-size:11.5px;color:var(--mut)}
.dim .dt{height:5px;border-radius:4px;background:#131f2a;overflow:hidden}
.dim .dt i{display:block;height:100%;background:linear-gradient(90deg,#2ee6c0,#3b82f6)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:12px}
.kv span{color:var(--dim)}
.kv b{font-weight:500;color:#c9d8e8;font-family:var(--mono);font-size:11.5px}
.warnline{color:var(--warn);font-size:11.5px;font-family:var(--mono)}

/* toast */
.toast{position:fixed;right:22px;bottom:22px;z-index:80;background:#12212c;border:1px solid #26404f;
  color:#d9f6ef;padding:10px 14px;border-radius:10px;font-size:12.5px;
  opacity:0;transform:translateY(8px);transition:.2s ease;pointer-events:none;max-width:380px}
.toast.on{opacity:1;transform:none}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .bcards{grid-template-columns:1fr 1fr}
}

</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <div class="dot"></div>
      <div class="brand-txt"><b>AgentEval</b><span>评测控制台</span></div>
    </div>

    <div class="rl">被测系统 <em id="rail-count"></em></div>
    <nav id="rail" class="rail-list"></nav>

    <div class="rail-filter">
      <div class="rl">筛选</div>
      <input id="q" class="input" placeholder="id / 分类 / 关键词">
      <label class="switch"><input type="checkbox" id="only-fail"><span>只看失败</span></label>
    </div>

    <div class="rail-foot">
      <div><span>数据源</span><b id="f-runs" class="ellip mono"></b></div>
      <div><span>生成于</span><b id="f-gen" class="mono"></b></div>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div>
        <h1>评测总览</h1>
        <p class="sub">规则机评 + LLM-Judge 双轨 · 风险维度一票否决 · 固定集回放</p>
      </div>
      <div class="head-actions">
        <div class="runmeta mono" id="runmeta"></div>
        <button class="btn ghost" id="btn-export">导出数据</button>
        <button class="btn" id="btn-refresh">刷新</button>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="panel">
      <div class="ph"><h2>各系统通过率</h2><span>点系统名进入明细 · 环形 = 规则通过率</span></div>
      <div class="bars" id="bars"></div>
    </section>

    <section class="panel">
      <div class="ph">
        <h2 id="table-title">用例明细</h2>
        <span id="table-note" class="mono"></span>
      </div>
      <div class="tw">
        <table id="cases">
          <thead><tr>
            <th data-sort="id">用例</th>
            <th data-sort="category">分类</th>
            <th data-sort="rule_score" class="num">规则分</th>
            <th data-sort="judge_score" class="num">Judge</th>
            <th data-sort="t_sut" class="num">耗时</th>
            <th data-sort="verdict">结论</th>
            <th></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>没有匹配的用例</div>
    </section>

    <section class="panel">
      <div class="ph"><h2>Badcase</h2><span>必须落到 数据集 / 评测标准 / 模型能力 / Agent 链路</span></div>
      <div class="bcards" id="badcards"></div>
    </section>

    <footer class="foot">
      AgentEval v0.2 · 证据链（断言 · 回答 · Judge 理由 · SUT 耗时）逐条可查 ·
      <span class="mono">python -m evalkit.cli serve</span>
    </footer>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <div class="mono did" id="d-id"></div>
      <div class="dsub" id="d-sub"></div>
    </div>
    <div class="dact">
      <button class="btn ghost sm" id="d-rerun">跑这套</button>
      <button class="btn ghost sm icon" id="d-close">✕</button>
    </div>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

n- **写入文件**：结果已写入\n  🧠 记忆已沉淀：计算 123*456 并把结果写入 answer...\n→ 剩余任务：['读取 answer.txt，确认文件内容为 56088', '核对结果是否与 123×456 的计算结果一致', '确认写入成功后，汇报总目标已完成']\n\n\n[产物 AI_Agent_5天入门学习计划.md]\n# AI Agent 入门 5 天学习计划\n\n> **更新记录**：本次更新为计划中引用的学习资源补全了具体链接/来源（原\"自行搜索\"类条目已替换为可直达的链接），并在文末增加「资源来源补充说明」与备用链接。\n\n## 一、计划总览\n\n**学习目标**：用 5 天时间，从零建立 AI Agent 的完整认知框架，掌握入门必备的 3 个核心概念，并能动手实现一个最小可用的 Agent。\n\n**每天节奏**：概念学习（40%）+ 动手实践（40%）+ 复盘输出（20%），建议每天投入 2 小时左右。\n\n**使用方式**：每天先读「学习目标」明确要达成什么 → 按「推荐资源」阅读 1~2 份核心材料 → 完成「动手练习」→ 对照「验收标准」自检，并输出当日复盘。\n\n---\n\n## 二、3 个核心概念（由浅入深分配）\n\n| 核心概念 | 难度 | 分配安排 |\n|---------|------|---------|\n| **概念 1：Agent 运行范式（感知—规划—行动循环）** | ⭐ 入门 | Day 1 建立认知 + Day 2 动手实践 |\n| **概念 2：工具调用（Tool Use / Function Calling）** | ⭐⭐ 进阶 | Day 3 集中学习 |\n| **概念 3：记忆与上下文管理（Memory & Context）** | ⭐⭐⭐ 较深 | Day 4 集中学习 |\n\n> 分配逻辑：概念 1 是理解 Agent 的\"地基\"，最浅但最重要，所以放在第 1 天建立心智模型、第 2 天用代码巩固；概念 2 和概念 3 分别扩展 Agent 的\"手\"（行动能力）和\"脑\"（记忆能力），按难度递增依次放在 Day 3、Day 4；Day 5 把三个概念串起来做综合实战。\n\n---\n\n## 三、每日详细计划\n\n### Day 1：认识 AI Agent 与核心概念 1（感知—规划—行动循环）\n\n**🎯 学习目标**（完成后逐条打勾）：\n- [ ] 能用一句话给 AI Agent 下定义，并说出它与普通 Chatbot 的 **至少 2 点** 区别。\n- [ ] 能画出「感知 → 规划 → 行动 → 回到感知」的循环图，并解释每一环节。\n- [ ] 能举出生活中 **2 个** Agent 的真实产品例子（如编程助手、客服机器人、AutoGPT 等）。\n- [ ] 能口头模拟一个简单 Agent（如查天气 Agent）处理一句话的完整循环。\n\n**核心内容**：\n1. AI Agent 的定义：能自主感知环境、做出决策、执行行动以实现目标的系统。\n2. 概念 1：Agent 运行范式\n   - 感知（Perceive）：从输入/环境中获取信息（用户消息、工具结果、外部数据）\n   - 规划（Plan）：基于目标与当前状态决定下一步做什么\n   - 行动（Act）：执行动作（回复用户、调用工具、修改状态），再回到感知，形成循环\n3. Agent 与传统 Chatbot 的区别：Chatbot 是\"一问一答\"，Agent 是\"目标驱动的循环\"。\n\n**📚 推荐资源**：\n| 资源 | 链接/出处 | 来源/备注 | 怎么看 |\n|------|----------|----------|--------|\n| Anthropic《Building Effective Agents》 | https://www.anthropic.com/engineering/building-effective-agents | Anthropic 官方工程博客（英文） | 重点读开头「What are agents?」部分，建立正确心智 |\n| Lilian Weng《LLM Powered Autonomous Agents》 | https://lilianweng.github.io/posts/2023-06-23-agent/ | Lilian Weng（OpenAI）个人博客，经典综述（英文） | 读「Agent System Overview」一节即可 |\n| OpenAI《A Practical Guide to Building Agents》 | https://openai.com/index/a-practical-guide-to-building-agents/ | OpenAI 官方博客（英文） | 看开头的 Agent 定义与工作流分类 |\n| 吴恩达短课《AI Agents in LangGraph》（第 1 课） | https://www.deeplearning.ai/short-courses/ai-agents-in-langgraph/ | DeepLearning.AI 官方视频课（英文，可开字幕） | 免费视频，直观理解\"什么是 Agent\" |\n| 中文科普（任选 1~2 篇） | 知乎专题搜索：https://www.zhihu.com/search?type=content&q=AI%20Agent%20是什么 ；媒体网站：机器之心 https://www.jiqizhixin.com/ 、量子位 https://www.qbitai.com/ | 中文社区/AI 媒体；用「AI Agent 是什么」「LLM Agent 入门」等关键词即可定位到具体文章 | 辅助理解，不必精读 |\n\n**🛠 动手练习**（按顺序完成）：\n1. **画循环图**：在纸上/白板上画出「感知 → 规划 → 行动」循环，并给每个环节标注 1 个具体例子（例如：感知 = 收到用户消息；规划 = 决定调用天气 API；行动 = 调用 API 并回复）。\n2. **手写模拟一次循环**：假设一个「查天气 Agent」，用下表的格式手写它处理\"明天要带伞吗\"这句话的完整过程：\n\n   | 步骤 | 环节 | 发生了什么 |\n   |------|------|-----------|\n   | 1 | 感知 | 收到用户输入\"明天要带伞吗\" |\n   | 2 | 规划 | 判断需要查询明天天气，决定调用天气工具 |\n   | 3 | 行动 | 调用 `get_weather(\"明天\")`，得到\"中雨 18°C\" |\n   | 4 | 感知 | 收到工具返回结果 |\n   | 5 | 规划 | 判断\"下雨需要带伞\"，准备回复 |\n   | 6 | 行动 | 回复\"明天有雨，记得带伞\" |\n\n3. **辨别 Agent**：列出 2 个你常用的产品（如 ChatGPT 普通对话、GitHub Copilot、外卖客服机器人、AutoGPT），用一句话判断它是否算 Agent，并说明理由（关键看：是否自主循环、是否调用工具、是否为目标行动）。\n\n**今日产出**：一张运行循环图 + 一段手写模拟流程 + 2 个 Agent 产品辨别记录。\n\n**验收标准**：能不看笔记解释清 Agent 与普通聊天机器人的本质区别，并复述循环三环节。\n\n---\n\n### Day 2：用代码实践概念 1——实现一个最小 Agent 循环\n\n**🎯 学习目标**（完成后逐条打勾）：\n- [ ] 能用 Python 的 `while` 循环写出一个 **可运行** 的 Agent 主循环骨架。\n- [ ] 能在代码中用注释标出「感知 / 规划 / 行动」三段分别对应哪几行。\n- [ ] 能解释 Agent 循环的 **终止条件** 有哪些（任务完成、用户结束、最大步数、异常退出）。\n- [ ] 能在循环中打印每一步的「当前状态、规划决策、执行动作」，并观察循环过程。\n\n**核心内容**：\n1. 用一个 while 循环实现 Agent 主循环骨架。\n2. 最简实现（伪代码/真实 Python 均可）：\n   - 输入 = 感知\n   - 用 if/else 或 LLM 输出决定下一步 = 规划\n   - 执行动作并更新状态 = 行动\n3. 加入\"终止条件\"（任务完成或达到最大步数），理解循环如何收敛。\n\n**📚 推荐资源**：\n| 资源 | 链接/出处 | 来源/备注 | 怎么看 |\n|------|----------|----------|--------|\n| ReAct 论文（Yao et al., 2022） | 摘要页：https://arxiv.org/abs/2210.03629 ；PDF：https://arxiv.org/pdf/2210.03629 | arXiv 论文（英文） | 只读摘要与 Figure 1，理解 Thought-Action-Observation 循环 |\n| LangGraph 官方文档（Agent 概念） | https://langchain-ai.github.io/langgraph/concepts/low_level/ | LangGraph 官方文档（英文） | 了解「节点 + 边 + 循环」如何描述 Agent |\n| 吴恩达短课《AI Agents in LangGraph》（第 1~2 节） | https://www.deeplearning.ai/short-courses/ai-agents-in-langgraph/ | DeepLearning.AI 官方视频课（英文） | 跟着视频看一个最小 agent 循环长什么样 |\n| Python 官方教程（如语法生疏） | 英文：https://docs.python.org/3/tutorial/ ；中文：https://do\n[产物 AI_Agent学习计划.md]\n# AI Agent 学习计划\n\n## 一、学习目标\n\n系统掌握 AI Agent 的核心原理与实践能力，能够独立设计、开发并评估一个可调用工具、具备记忆能力的智能体。\n\n## 二、3 个核心概念\n\n### 概念 1：Agent 架构与推理循环\n\nAgent 的本质是一个「感知 → 思考 → 行动」的闭环。需要掌握：\n\n- **ReAct 模式**：让模型交替进行「推理（Reasoning）」与「行动（Acting）」，边想边做。\n- **规划能力**：任务分解（Plan-and-Execute）、反思与自我纠错（Reflection）。\n- **控制流程**：何时停止、何时调用工具、如何根据反馈调整下一步。\n\n### 概念 2：工具调用（Tool Use / Function Calling）\n\n让 Agent 突破语言模型的边界，真正作用于外部世界。需要掌握：\n\n- **函数调用机制**：模型如何输出结构化的工具调用请求（名称 + 参数）。\n- **工具定义与接口设计**：如何清晰描述工具的用途、参数 schema 和返回值。\n- **工具编排**：多工具组合、结果回传、异常处理与重试。\n\n### 概念 3：记忆与上下文管理\n\n让 Agent 具备跨轮次、跨任务的连续性与个性化。需要掌握：\n\n- **短期记忆**：对话上下文窗口的管理、消息裁剪与摘要。\n- **长期记忆**：向量数据库、检索增强（RAG）、用户画像存储。\n- **记忆的写入与检索策略**：什么该记、何时调用、如何检索最相关的信息。\n\n## 三、分阶段学习计划\n\n| 阶段 | 主题 | 学习内容 | 实践产出 |\n|------|------|----------|----------|\n| 第 1 周 | 基础概念 | 理解 Agent 架构、ReAct 推理循环 | 手写一个简单的 ReAct 伪代码流程 |\n| 第 2 周 | 工具调用 | 学习 Function Calling、工具接口设计 | 实现一个能查天气/算数的 Agent |\n| 第 3 周 | 记忆管理 | 学习短期/长期记忆、RAG 检索 | 实现带对话记忆的客服 Agent |\n| 第 4 周 | 综合实战 | 融合架构、工具、记忆三大能力 | 完成一个完整的个人助理 Agent |\n\n## 四、学习建议\n\n1. **先跑通再深入**：先调用现成框架（如 LangChain / OpenAI Agents SDK）跑通 Demo，再逐层拆解原理。\n2. **重视可观测性**：为 Agent 记录每一步的思考与工具调用日志，便于调试。\n3. **小步迭代**：每次只加一个新能力（先工具、后记忆），避免一次引入过多变量。\n4. **以项目驱动**：围绕一个真实场景持续打磨，比孤立学概念更有效。\n\n## 五、验收标准\n\n- 能清楚解释 ReAct 循环的执行过程。\n- 能独立定义一个工具并让 Agent 正确调用。\n- 能实现一个拥有长期记忆、跨对话可检索信息的 Agent。\n\n[产物 README.md]\n# 🛒 电商数据分析平台\n\n一个完整、可直接运行的电商数据分析平台，涵盖「数据生成 → 数据处理 → 可视化看板 → 智能洞察 → 数据导出」全链路。\n\n## 文件说明\n\n| 文件 | 说明 |\n|------|------|\n| `ecommerce_dashboard.html` | **可视化数据分析看板**（核心），双击即可在浏览器中打开，无需安装任何环境 |\n| `ecommerce_analysis.py` | *", "rule_score": 100.0, "rule_pass": true, "judge_score": null, "risk_fail": false, "t_sut": 12.583, 先读「学习目标」明确要达成什么 → 按「推荐资源」阅读 1~2 份核心材料 → 完成「动手练习」→ 对照「验收标准」自检，并输出当日复盘。\n\n---\n\n## 二、3 个核心概念（由浅入深分配）\n\n| 核心概念 | 难度 | 分配安排 |\n|---------|------|---------|\n| **概念 1：Agent 运行范式（感知—规划—行动循环）** | ⭐ 入门 | Day 1 建立认知 + Day 2 动手实践 |\n| **概念 2：工具调用（Tool Use / Function Calling）** | ⭐⭐ 进阶 | Day 3 集中学习 |\n| **概念 3：记忆与上下文管理（Memory & Context）** | ⭐⭐⭐ 较深 | Day 4 集中学习 |\n\n> 分配逻辑：概念 1 是理解 Agent 的\"地基\"，最浅但最重要，所以放在第 1 天建立心智模型、第 2 天用代码巩固；概念 2 和概念 3 分别扩展 Agent 的\"手\"（行动能力）和\"脑\"（记忆能力），按难度递增依次放在 Day 3、Day 4；Day 5 把三个概念串起来做综合实战。\n\n---\n\n## 三、每日详细计划\n\n### Day 1：认识 AI Agent 与核心概念 1（感知—规划—行动循环）\n\n**🎯 学习目标**（完成后逐条打勾）：\n- [ ] 能用一句话给 AI Agent 下定义，并说出它与普通 Chatbot 的 **至少 2 点** 区别。\n- [ ] 能画出「感知 → 规划 → 行动 → 回到感知」的循环图，并解释每一环节。\n- [ ] 能举出生活中 **2 个** Agent 的真实产品例子（如编程助手、客服机器人、AutoGPT 等）。\n- [ ] 能口头模拟一个简单 Agent（如查天气 Agent）处理一句话的完整循环。\n\n**核心内容**：\n1. AI Agent 的定义：能自主感知环境、做出决策、执行行动以实现目标的系统。\n2. 概念 1：Agent 运行范式\n   - 感知（Perceive）：从输入/环境中获取信息（用户消息、工具结果、外部数据）\n   - 规划（Plan）：基于目标与当前状态决定下一步做什么\n   - 行动（Act）：执行动作（回复用户、调用工具、修改状态），再回到感知，形成循环\n3. Agent 与传统 Chatbot 的区别：Chatbot 是\"一问一答\"，Agent 是\"目标驱动的循环\"。\n\n**📚 推荐资源**：\n| 资源 | 链接/出处 | 来源/备注 | 怎么看 |\n|------|----------|----------|--------|\n| Anthropic《Building Effective Agents》 | https://www.anthropic.com/engineering/building-effective-agents | Anthropic 官方工程博客（英文） | 重点读开头「What are agents?」部分，建立正确心智 |\n| Lilian Weng《LLM Powered Autonomous Agents》 | https://lilianweng.github.io/posts/2023-06-23-agent/ | Lilian Weng（OpenAI）个人博客，经典综述（英文） | 读「Agent System Overview」一节即可 |\n| OpenAI《A Practical Guide to Building Agents》 | https://openai.com/index/a-practical-guide-to-building-agents/ | OpenAI 官方博客（英文） | 看开头的 Agent 定义与工作流分类 |\n| 吴恩达短课《AI Agents in LangGraph》（第 1 课） | https://www.deeplearning.ai/short-courses/ai-agents-in-langgraph/ | DeepLearning.AI 官方视频课（英文，可开字幕） | 免费视频，直观理解\"什么是 Agent\" |\n| 中文科普（任选 1~2 篇） | 知乎专题搜索：https://www.zhihu.com/search?type=content&q=AI%20Agent%20是什么 ；媒体网站：机器之心 https://www.jiqizhixin.com/ 、量子位 https://www.qbitai.com/ | 中文社区/AI 媒体；用「AI Agent 是什么」「LLM Agent 入门」等关键词即可定位到具体文章 | 辅助理解，不必精读 |\n\n**🛠 动手练习**（按顺序完成）：\n1. **画循环图**：在纸上/白板上画出「感知 → 规划 → 行动」循环，并给每个环节标注 1 个具体例子（例如：感知 = 收到用户消息；规划 = 决定调用天气 API；行动 = 调用 API 并回复）。\n2. **手写模拟一次循环**：假设一个「查天气 Agent」，用下表的格式手写它处理\"明天要带伞吗\"这句话的完整过程：\n\n   | 步骤 | 环节 | 发生了什么 |\n   |------|------|-----------|\n   | 1 | 感知 | 收到用户输入\"明天要带伞吗\" |\n   | 2 | 规划 | 判断需要查询明天天气，决定调用天气工具 |\n   | 3 | 行动 | 调用 `get_weather(\"明天\")`，得到\"中雨 18°C\" |\n   | 4 | 感知 | 收到工具返回结果 |\n   | 5 | 规划 | 判断\"下雨需要带伞\"，准备回复 |\n   | 6 | 行动 | 回复\"明天有雨，记得带伞\" |\n\n3. **辨别 Agent**：列出 2 个你常用的产品（如 ChatGPT 普通对话、GitHub Copilot、外卖客服机器人、AutoGPT），用一句话判断它是否算 Agent，并说明理由（关键看：是否自主循环、是否调用工具、是否为目标行动）。\n\n**今日产出**：一张运行循环图 + 一段手写模拟流程 + 2 个 Agent 产品辨别记录。\n\n**验收标准**：能不看笔记解释清 Agent 与普通聊天机器人的本质区别，并复述循环三环节。\n\n---\n\n### Day 2：用代码实践概念 1——实现一个最小 Agent 循环\n\n**🎯 学习目标**（完成后逐条打勾）：\n- [ ] 能用 Python 的 `while` 循环写出一个 **可运行** 的 Agent 主循环骨架。\n- [ ] 能在代码中用注释标出「感知 / 规划 / 行动」三段分别对应哪几行。\n- [ ] 能解释 Agent 循环的 **终止条件** 有哪些（任务完成、用户结束、最大步数、异常退出）。\n- [ ] 能在循环中打印每一步的「当前状态、规划决策、执行动作」，并观察循环过程。\n\n**核心内容**：\n1. 用一个 while 循环实现 Agent 主循环骨架。\n2. 最简实现（伪代码/真实 Python 均可）：\n   - 输入 = 感知\n   - 用 if/else 或 LLM 输出决定下一步 = 规划\n   - 执行动作并更新状态 = 行动\n3. 加入\"终止条件\"（任务完成或达到最大步数），理解循环如何收敛。\n\n**📚 推荐资源**：\n| 资源 | 链接/出处 | 来源/备注 | 怎么看 |\n|------|----------|----------|--------|\n| ReAct 论文（Yao et al., 2022） | 摘要页：https://arxiv.org/abs/2210.03629 ；PDF：https://arxiv.org/pdf/2210.03629 | arXiv 论文（英文） | 只读摘要与 Figure 1，理解 Thought-Action-Observation 循环 |\n| LangGraph 官方文档（Agent 概念） | https://langchain-ai.github.io/langgraph/concepts/low_level/ | LangGraph 官方文档（英文） | 了解「节点 + 边 + 循环」如何描述 Agent |\n| 吴恩达短课《AI Agents in LangGraph》（第 1~2 节） | https://www.deeplearning.ai/short-courses/ai-agents-in-langgraph/ | DeepLearning.AI 官方视频课（英文） | 跟着视频看一个最小 agent 循环长什么样 |\n| Python 官方教程（如语法生疏） | 英文：https://docs.python.org/3/tutorial/ ；中文：https://do\n[产物 AI_Agent学习计划.md]\n# AI Agent 学习计划\n\n## 一、学习目标\n\n系统掌握 AI Agent 的核心原理与实践能力，能够独立设计、开发并评估一个可调用工具、具备记忆能力的智能体。\n\n## 二、3 个核心概念\n\n### 概念 1：Agent 架构与 <script>
/* AgentEval 控制台前端：只认 /api/overview、/api/suite/{slug}、/api/run/{slug}、/api/status
   没有框架、没有 CDN —— 副本可以直接随仓库分发，离线也能开（静态快照走 web.py）。 */
const $ = (s) => document.querySelector(s);
const COL = { ok: "#2ee6c0", warn: "#ffb84d", bad: "#ff6b6b" };
const state = { ov: null, active: null, cache: {}, sort: { key: "rule_score", dir: -1 }, open: null };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, suf = "") => (v === null || v === undefined ? "—" : v + suf);
const color = (rate) => (rate >= 90 ? COL.ok : rate >= 70 ? COL.warn : COL.bad);

const SNAP = window.__SNAPSHOT__ || null;   // 单文件静态版：数据内联，不走网络

async function api(path, opts) {
  if (SNAP) {                                // 静态模式：把接口映射到内联数据
    if (path === "/api/overview") return SNAP.overview;
    const m = path.match(/^\/api\/suite\/(.+)$/);
    if (m) return { slug: m[1], cases: SNAP.suites[m[1]] || [] };
    if (path.startsWith("/api/run") || path === "/api/status") return { running: {}, last: null, log: {} };
  }
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${path} → ${r.status}`);
  return r.json();
}

function toast(msg, ms = 2600) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("on"), ms);
}

/* ---------------------------------------------------------------- rail */
function ringSvg(rate) {
  const c = color(rate);
  return `<span class="ring" style="background:conic-gradient(${c} ${rate}%,#1a2632 0)">
    <i>${rate}%</i></span>`;
}

function renderRail() {
  const ov = state.ov;
  $("#rail-count").textContent = `${ov.totals.systems}`;
  $("#rail").innerHTML = ov.suites
    .map(
      (s) => `<div class="s ${state.active === s.slug ? "on" : ""}" data-slug="${s.slug}">
        ${ringSvg(s.rate)}
        <span class="meta"><span class="n">${esc(s.suite)}</span>
        <em>${s.cases} 条 · p50 ${fmt(s.p50)}s</em></span>
        <button class="runbtn" data-run="${s.slug}" title="跑这套">▶</button>
      </div>`
    )
    .join("");
  $("#f-runs").textContent = ov.runs_dir;
  $("#f-gen").textContent = ov.generated_at;
}

/* ---------------------------------------------------------------- KPI */
function renderKpis() {
  const t = state.ov.totals;
  const cards = [
    { k: "规则通过率", v: t.rate + "%", cls: "acc", s: `${t.pass} / ${t.cases} 条用例` },
    { k: "Judge 一致率", v: fmt(t.judge_rate, "%"), cls: "", s: `${t.judge_n} 条被判` },
    { k: "待修 badcase", v: t.badcases, cls: t.badcases ? "warn" : "", s: `risk_fail ${t.risk_fail}` },
    { k: "接入系统", v: t.systems, cls: "", s: "python × 5 · http × 1" },
  ];
  $("#kpis").innerHTML = cards
    .map((c) => `<div class="kpi"><div class="k">${c.k}</div>
      <div class="v ${c.cls}">${c.v}</div><div class="s">${c.s}</div></div>`)
    .join("");
}

/* ---------------------------------------------------------------- 通过率条 */
function renderBars() {
  const head = `<div class="brow bhead"><div class="nm">系统</div><div></div>
    <div class="val">通过率</div><div class="sm">judge</div><div class="sm">hit@1</div><div class="sm">p50</div></div>`;
  $("#bars").innerHTML = head + state.ov.suites
    .map((s) => {
      const c = color(s.rate);
      return `<div class="brow" data-slug="${s.slug}">
        <div class="nm">${esc(s.suite)}</div>
        <div class="track"><i style="width:${s.rate}%;background:${c}"></i></div>
        <div class="val" style="color:${c}">${s.rate}%</div>
        <div class="sm">${fmt(s.judge_rate, "%")}</div>
        <div class="sm">${fmt(s.hit1, "%")}</div>
        <div class="sm">${fmt(s.p50)}s</div>
      </div>`;
    })
    .join("");
}

/* ---------------------------------------------------------------- 明细表 */
async function casesFor(slug) {
  if (state.cache[slug]) return state.cache[slug];
  const d = await api(`/api/suite/${slug}`);
  state.cache[slug] = d.cases.map((c) => ({ ...c, suite: slug }));
  return state.cache[slug];
}

async function allCases() {
  const slugs = state.ov.suites.map((s) => s.slug);
  const all = await Promise.all(slugs.map(casesFor));
  return all.flat();
}

function applyFilter(rows) {
  const q = $("#q").value.trim().toLowerCase();
  const onlyFail = $("#only-fail").checked;
  return rows.filter((r) => {
    if (onlyFail && r.rule_pass) return false;
    if (!q) return true;
    return [r.id, r.category, r.answer, (r.turns || []).join(" ")]
      .join(" ").toLowerCase().includes(q);
  });
}

function sortRows(rows) {
  const { key, dir } = state.sort;
  return rows.slice().sort((a, b) => {
    const pick = (r) =>
      key === "verdict" ? (r.rule_pass ? 1 : 0) : r[key] === null || r[key] === undefined ? -Infinity : r[key];
    const va = pick(a), vb = pick(b);
    if (typeof va === "string" || typeof vb === "string") return String(va).localeCompare(String(vb)) * dir;
    return (va - vb) * dir;
  });
}

async function renderTable() {
  const rows = sortRows(applyFilter(state.active ? await casesFor(state.active) : await allCases()));
  $("#table-title").textContent = state.active
    ? `${state.ov.suites.find((s) => s.slug === state.active).suite} · 用例明细`
    : "全部用例";
  $("#table-note").textContent = `${rows.length} 条`;
  document.querySelectorAll("th[data-sort]").forEach((th) =>
    th.classList.toggle("sorted", th.dataset.sort === state.sort.key));

  const tb = $("#cases tbody");
  tb.innerHTML = rows
    .map((r) => {
      const v = r.rule_pass
        ? '<span class="pill ok"><span class="dotp"></span>通过</span>'
        : r.risk_fail
        ? '<span class="pill risk"><span class="dotp"></span>风险否决</span>'
        : '<span class="pill no"><span class="dotp"></span>失败</span>';
      return `<tr class="row" data-slug="${r.suite}" data-id="${esc(r.id)}">
        <td class="id">${esc(r.id)}</td>
        <td>${esc(r.category || "")}</td>
        <td class="num">${fmt(r.rule_score)}</td>
        <td class="num">${fmt(r.judge_score)}</td>
        <td class="num">${fmt(r.t_sut)}s</td>
        <td>${v}</td>
        <td class="chev">›</td>
      </tr>`;
    })
    .join("");
  $("#empty").hidden = rows.length > 0;
}

/* ---------------------------------------------------------------- badcase 卡 */
function renderBadcards() {
  const items = [];
  state.ov.suites.forEach((s) => s.badcases.forEach((b) => items.push({ slug: s.slug, id: b, suite: s.suite })));
  $("#badcards").innerHTML = items.length
    ? items
        .map(
          (b) => `<div class="bcard" data-slug="${b.slug}" data-id="${esc(b.id)}">
            <div class="bid">${esc(b.id)}</div>
            <div class="bs">${esc(b.suite)}</div></div>`
        )
        .join("")
    : '<div class="bnone">当前没有 badcase。</div>';
}

/* ---------------------------------------------------------------- 抽屉 */
function checksHtml(checks) {
  return (checks || [])
    .map((c) => {
      const cls = c.result === true ? "ok" : c.result === false ? "no" : "na";
      const label = c.result === true ? "通过" : c.result === false ? "失败" : "NA";
      return `<span class="chk ${cls}">${esc(c.check)} · ${esc(c.dim)} · ${label}${
        c.err ? " · " + esc(c.err) : ""}</span>`;
    })
    .join("");
}

function dimsHtml(dims) {
  const keys = Object.keys(dims || {});
  if (!keys.length) return '<span class="warnline">该用例没有可计分的维度</span>';
  return `<div class="dims">${keys
    .map((k) => {
      const v = dims[k];
      const num = v === "NA" ? 0 : Number(v);
      return `<div class="dim"><span>${esc(k)}</span>
        <span class="dt"><i style="width:${num * 10}%"></i></span>
        <span class="mono">${esc(v)}</span></div>`;
    })
    .join("")}</div>`;
}

async function openCase(slug, id) {
  const rows = await casesFor(slug);
  const r = rows.find((x) => x.id === id);
  if (!r) return;
  state.open = { slug, id };
  $("#d-id").textContent = `${r.id}`;
  $("#d-sub").textContent = `${state.ov.suites.find((s) => s.slug === slug)?.suite || slug} · ${r.category || ""}`;
  const body = [];
  body.push(`<div class="dsec"><h3>输入 <em>${(r.turns || []).length} 轮</em></h3>
    <div class="turns">${(r.turns || []).map((t) => `<div class="turn">${esc(t)}</div>`).join("")}</div></div>`);
  body.push(`<div class="dsec"><h3>实际输出 <em>rule ${fmt(r.rule_score)} · judge ${fmt(r.judge_score)}</em></h3>
    <pre>${esc(r.answer || "(空)")}</pre></div>`);
  if (r.error) body.push(`<div class="dsec"><h3>SUT 异常</h3><div class="warnline">${esc(r.error)}</div></div>`);
  body.push(`<div class="dsec"><h3>断言 <em>${(r.checks || []).length} 条</em></h3>
    <div class="checks">${checksHtml(r.checks)}</div></div>`);
  body.push(`<div class="dsec"><h3>维度得分 <em>0-10</em></h3>${dimsHtml(r.dim_scores)}</div>`);
  if (r.judge_reason) body.push(`<div class="dsec"><h3>Judge 理由</h3><div class="turn">${esc(r.judge_reason)}</div></div>`);
  if (r.retrieved && r.retrieved.length)
    body.push(`<div class="dsec"><h3>检索命中</h3><div class="kv">${r.retrieved
      .map((x) => `<span>${esc(typeof x === "string" ? x : x.source || "")}</span><b></b>`)
      .join("")}</div></div>`);
  body.push(`<div class="dsec"><h3>耗时</h3><div class="kv">
    <span>SUT</span><b>${fmt(r.t_sut)}s</b><span>suite</span><b>${esc(slug)}</b></div></div>`);
  $("#d-body").innerHTML = body.join("");
  $("#drawer").classList.add("on");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
}

function closeDrawer() {
  $("#drawer").classList.remove("on");
  $("#drawer").setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
  state.open = null;
}

/* ---------------------------------------------------------------- 跑批 */
async function runSuite(slug) {
  try {
    const r = await api(`/api/run/${slug}`, { method: "POST" });
    if (!r.started) return toast(`已经在跑了（自 ${r.since}）`);
    toast(`已开始跑 ${slug} …`);
    $("#runmeta").textContent = `running ${slug}`;
    const timer = setInterval(async () => {
      const st = await api("/api/status");
      const cur = st.running[slug];
      if (!cur || cur.state !== "running") {
        clearInterval(timer);
        $("#runmeta").textContent = "";
        toast(cur && cur.state === "failed" ? `${slug} 跑批失败，看终端输出` : `${slug} 跑完了，刷新中…`);
        state.cache = {};
        await load();
      }
    }, 1600);
  } catch (e) {
    toast(`跑批失败：${e.message}`);
  }
}

/* ---------------------------------------------------------------- 事件 */
function bind() {
  $("#rail").addEventListener("click", (e) => {
    const run = e.target.closest("[data-run]");
    if (run) { e.stopPropagation(); return runSuite(run.dataset.run); }
    const item = e.target.closest(".s");
    if (item) selectSuite(item.dataset.slug);
  });
  $("#bars").addEventListener("click", (e) => {
    const row = e.target.closest(".brow");
    if (row) selectSuite(row.dataset.slug);
  });
  $("#cases").addEventListener("click", (e) => {
    const tr = e.target.closest("tr.row");
    if (tr) openCase(tr.dataset.slug, tr.dataset.id);
  });
  $("#badcards").addEventListener("click", (e) => {
    const c = e.target.closest(".bcard");
    if (c) openCase(c.dataset.slug, c.dataset.id);
  });
  document.querySelectorAll("th[data-sort]").forEach((th) =>
    th.addEventListener("click", async () => {
      const k = th.dataset.sort;
      state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : -1 };
      await renderTable();
    }));
  $("#q").addEventListener("input", debounce(renderTable, 180));
  $("#only-fail").addEventListener("change", renderTable);
  $("#btn-refresh").addEventListener("click", async () => { state.cache = {}; await load(); toast("已刷新"); });
  $("#btn-export").addEventListener("click", async () => {
    const data = await api("/api/overview");
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "agenteval-overview.json";
    a.click();
    toast("已导出 overview.json");
  });
  $("#d-close").addEventListener("click", closeDrawer);
  $("#backdrop").addEventListener("click", closeDrawer);
  $("#d-rerun").addEventListener("click", () => state.open && runSuite(state.open.slug));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

async function selectSuite(slug) {
  state.active = state.active === slug ? null : slug;
  renderRail();
  await renderTable();
  if (state.active) toast(`只看 ${slug}`);
}

/* ---------------------------------------------------------------- 启动 */
async function load() {
  state.ov = await api("/api/overview");
  renderRail();
  renderKpis();
  renderBars();
  renderBadcards();
  await renderTable();
}

bind();
load().catch((e) => {
  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="toast on">加载失败：${esc(e.message)} —— 先跑 <b>python -m evalkit.cli serve</b></div>`);
});

</script>
</body>
</html>
