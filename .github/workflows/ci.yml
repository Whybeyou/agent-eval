name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 平台自测 + 离线 suite（口径门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: python -m pip install -U pip pytest fastapi uvicorn httpx

      - name: 平台自测（断言 / 打分 / κ / 协议隔离 / 看板）
        run: pytest tests -q

      - name: 两个离线 suite（无需 key 与服务）
        run: python -m evalkit.cli run suites/toy_agent suites/ecom_rag

      - name: 口径门禁（通过率区间 + badcase 集合必须与预期一致）
        run: |
          python - <<'PY'
          import json

          def load(p):
              return [json.loads(l) for l in open(p, encoding="utf-8") if l.strip()]

          def check(path, n_expected, lo, hi, bad_expected):
              recs = load(path)
              bad = sorted(r["id"] for r in recs if not r["rule_pass"])
              rate = 100.0 * sum(1 for r in recs if r["rule_pass"]) / len(recs)
              print(f"{path}: n={len(recs)} rate={rate:.1f}% bad={bad}")
              assert len(recs) == n_expected, f"用例数量变了：{len(recs)}"
              assert lo <= rate <= hi, f"通过率漂移：{rate:.1f}%"
              assert bad == bad_expected, bad
              return recs

          check("runs/toy_agent.jsonl", 10, 70, 90, ["TOY-B01", "TOY-N01"])
          ec = check("runs/ecom_rag.jsonl", 16, 80, 95, ["EC-B01", "EC-M03"])

          hit = [r for r in ec if r.get("hit1") is not None]
          h1 = sum(1 for r in hit if r["hit1"]) / len(hit)
          print(f"ecom Hit@1 = {h1:.1%}")
          assert h1 >= 0.85, f"Hit@1 掉了：{h1:.1%}"
          PY

      - name: 看板
        run: python -m evalkit.cli report runs/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-runs
          path: |
            runs/
            reports/
          if-no-files-found: warn

  llm-judge:
    name: LLM-Judge 一致率（需要 DEEPSEEK_API_KEY）
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查 secret（没有就跳过，别卡住公开仓的 contributor）
        id: key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过::未配置 DEEPSEEK_API_KEY"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 规则 + Judge 双轨跑电商 suite
        if: steps.key.outputs.has_key == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python -m evalkit.cli run suites/ecom_rag --judge
          python - <<'PY'
          import json
          recs = [json.loads(l) for l in open("runs/ecom_rag.jsonl", encoding="utf-8") if l.strip()]
          judged = [r for r in recs if r.get("judge_pass") is not None]
          assert judged, "Judge 一条都没判出来（看 key 或配额）"
          agree = sum(1 for r in judged if bool(r["judge_pass"]) == bool(r["rule_pass"]))
          rate = 100.0 * agree / len(judged)
          print(f"judge n={len(judged)} agreement={rate:.1f}%")
          assert rate >= 60, f"人机一致率过低：{rate:.1f}%"
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-runs
          path: runs/
          if-no-files-found: warn
